[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chess-gantry"
version = "0.2.0"
description = "JSON-to-G-code framework for a Raspberry Pi chess gantry using Marlin over serial"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pyserial>=3.5,<4",
  "qrcode>=8.2,<9",
  "chess>=1.11.2,<2",
  "berserk>=0.13.2,<1",
  "pyjwt[crypto]>=2.10,<3",
  "opencv-python-headless>=4.13,<4.14",
  "numpy>=2,<3",
  "openai>=2.53,<3",
  "pydantic>=2.12,<3",
  "httpx>=0.28,<1",
  "anthropic>=0.69,<1",
]

[project.scripts]
chess-gantry = "chess_gantry.cli:main"

[project.optional-dependencies]
debug-console = ["django>=5.2,<6 ; python_full_version >= '3.10'"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"chess_gantry.debug_console" = ["templates/debug_console/*.html"]

[dependency-groups]
dev = ["black>=25.9,<26"]

[tool.black]
target-version = ["py39"]
extend-exclude = '''
/(
  \.kilo
  | \.venv
  | build
  | chicken
  | dist
  | data
)/
'''
