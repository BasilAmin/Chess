name: Format

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: format-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Install Python
        run: uv python install 3.11
      - name: Prettier (check)
        run: node node_modules/prettier/bin/prettier.cjs --check .
      - name: Black (check)
        run: uvx black@25.9.0 --check .
      - name: Comments and docstrings (check)
        run: uv run --no-project python scripts/strip_comments.py --check src tests examples scripts
